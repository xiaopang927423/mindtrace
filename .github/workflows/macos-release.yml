name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version and architecture
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build DMG
        run: npm run package -- --publish never
      - name: Verify and test installed application
        run: |
          dmg="dist/MindTrace-${RELEASE_TAG#v}-mac-arm64.dmg"
          mount_dir="$RUNNER_TEMP/mindtrace-dmg"
          installed_app="$RUNNER_TEMP/思序.app"
          mkdir -p "$mount_dir"
          hdiutil verify "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" || true' EXIT
          ditto "$mount_dir/思序.app" "$installed_app"
          hdiutil detach "$mount_dir"
          trap - EXIT
          codesign --verify --deep --strict "$installed_app"
          MINDTRACE_APP_EXECUTABLE="$installed_app/Contents/MacOS/思序" npm run test:ui
      - name: Generate SHA-256 checksum
        working-directory: dist
        run: shasum -a 256 "MindTrace-${RELEASE_TAG#v}-mac-arm64.dmg" > SHA256SUMS.txt
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/mindtrace-release.json"; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "MindTrace $RELEASE_TAG" \
              --notes "Apple Silicon Mac DMG. Ad-hoc signed; not Apple-notarized. See README for installation and SHA256SUMS.txt for the checksum."
            gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/mindtrace-release.json"
          fi
          if ! jq -e '.isDraft == true' "$RUNNER_TEMP/mindtrace-release.json" > /dev/null; then
            echo 'Refusing to replace assets in an already published release.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/MindTrace-${RELEASE_TAG#v}-mac-arm64.dmg" \
            dist/SHA256SUMS.txt --clobber
          echo "DMG and checksum uploaded to the draft release for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
